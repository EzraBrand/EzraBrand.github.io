<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved</title>
<script>
// Old ezrabrand.github.io/<repo>/ paths of works that moved to openseforim.org.
// Add one line for each repo you move.
var MOVED = {
  "emden-megillat-sefer": "https://openseforim.org/emden/"
};
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var dest = parts.length && MOVED[parts[0]];
  if (dest) {
    location.replace(dest + parts.slice(1).join("/") + location.search + location.hash);
  }
})();
</script>
